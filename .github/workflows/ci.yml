name: apxm-ci

# Runs only on a push to main, on the platform's VPS runners. Nothing is stored on
# GitHub: no artifact upload, no Actions cache, no GHCR, no Release. Pull requests are
# checked locally with `dekk agents ci`. This workflow runs the fast check on each batched
# push; the long-running suites (MLIR compiler tests, CLI build, frontends, source port,
# qualification, release cohort) run in nightly.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch, and never cancelled: a cancelled run could leave a
# commit only partly published.
concurrency:
  group: apxm-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The check pool is named by the repository variable CI_POOL_LABEL, the label the site
  # declares for its shared pool (an unprivileged container with no registry route). The job
  # mints no token, so it holds no `id-token` permission.
  check:
    runs-on: ${{ vars.CI_POOL_LABEL }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      APXM_CAPTURE_CONFINEMENT: enforce
      # The pool's persistent caches (see the measurements in the pull request).
      UV_CACHE_DIR: /var/cache/ci/uv
      npm_config_cache: /var/cache/ci/npm
      CARGO_HOME: /var/cache/ci/cargo
      SCCACHE_DIR: /var/cache/ci/sccache
      # Peak memory of the MLIR steps, measured against a 2 GiB limit: one cargo job,
      # and one test thread so the source-port suite does not start 30 frontends at once.
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 1
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the locked Nix environment
        run: nix --option max-jobs 1 --option cores 1 flake check --all-systems --no-update-lock-file

      # The service gate without the long-running suites (HEAVY_SERVICE_COMMANDS).
      - name: Run the fast CI check
        env:
          APXM_COMMIT_LINT_RANGE: ${{ github.event.before && format('{0}..{1}', github.event.before, github.sha) || '' }}
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents check-service-fast

  # Builds the service images, then publishes each to the platform registry as
  # ci/<workload>/<service>:<sha> and attests it, through the platform's publish helper
  # (vendored in .github/scripts/publish). The runner holds no registry credential: the
  # helper proves the job to the registry token exchange with an OIDC token whose audience
  # is <prefix>:<site>:publish, and attests each digest with <prefix>:<digest>. The pool is
  # named by CI_PUBLISH_LABEL, a pool the site declares as publishing; the audience prefix is
  # CI_AUDIENCE_PREFIX. Both are repository variables, never values in this file.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ${{ vars.CI_PUBLISH_LABEL }}
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      APXM_CAPTURE_CONFINEMENT: enforce
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      # The check job ran on another runner, so the cohort is prepared again here.
      - name: Prepare the exact AMD64 release cohort
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents prepare-release-descriptors

      - name: Build the Linux AMD64 service image pair
        run: >-
          nix --option max-jobs 1 --option cores 1 develop --command dekk agents build-images
          --platform linux/amd64
          --qualified-descriptor-overlay

      - name: Verify the built image pair from the consumer boundary
        run: |
          # shellcheck disable=SC2016
          nix --option max-jobs 1 --option cores 1 develop --command bash -euo pipefail -c '
            dekk agents verify-images > image-evidence-verification.json
            python -m json.tool image-evidence-verification.json >/dev/null
          '

      # The helper rebuilds each verified image from its cached layers, pushes it once under
      # ci/<workload>/<service>:<sha>, and attaches the proof of origin to the pushed digest.
      - name: Publish the verified images and attest their digests
        env:
          WORKLOAD: apxm
          AUDIENCE_PREFIX: ${{ vars.CI_AUDIENCE_PREFIX }}
          CI_WORKFLOW: .github/workflows/ci.yml
          ORAS_VERSION: "1.3.6"
          ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
        run: |
          for service in compilation-service runtime-service; do
            mapfile -t build_arguments < <(
              nix --option max-jobs 1 --option cores 1 develop --command \
                dekk agents publish-arguments --service "$service" --platform linux/amd64
            )
            ARTIFACT="$service" CONTAINERFILE="deploy/Dockerfile.$service" \
              .github/scripts/publish/publish.sh "${build_arguments[@]}"
          done
