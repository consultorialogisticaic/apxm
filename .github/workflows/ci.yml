name: apxm-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# A run that publishes must finish: a cancelled push would leave a built
# commit without its proof of origin. Only pull request runs are superseded.
concurrency:
  group: apxm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # A runner must never execute code from an untrusted fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Build code runs only on an ephemeral, one-job runner of the apxm scale set.
    runs-on: [apxm]
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      APXM_CAPTURE_CONFINEMENT: enforce
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:

      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the locked Nix environment
        run: nix --option max-jobs 1 --option cores 1 flake check --all-systems --no-update-lock-file

      - name: Run the APXM service-owner gate
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents check-service

      - name: Prepare the exact AMD64 release cohort
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents prepare-release-descriptors

      - name: Package and qualify the immutable APXM cohort
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents package-release

      - name: Verify the packaged APXM cohort as a consumer
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents verify-package

      - name: Build the Linux AMD64 service image pair
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: >-
          nix --option max-jobs 1 --option cores 1 develop --command dekk agents build-images
          --platform linux/amd64
          --qualified-descriptor-overlay

      - name: Verify the built image pair from the consumer boundary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # shellcheck disable=SC2016
          nix --option max-jobs 1 --option cores 1 develop --command bash -euo pipefail -c '
            dekk agents verify-images > image-evidence-verification.json
            python -m json.tool image-evidence-verification.json >/dev/null
          '

      - name: Push the verified images and attach their proof of origin
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          HOSTPLANE_OIDC_AUDIENCE_PREFIX: hostplane
        run: |
          for service in compilation-service runtime-service; do
            .github/scripts/zot-publish.sh publish apxm "$service" "apxm/$service:${GITHUB_SHA::8}" | tail -n 1
          done
