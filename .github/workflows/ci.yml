name: apxm-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apxm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service-gate:
    # A self-hosted runner must never execute code from an untrusted fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Pull requests and non-main manual runs use GitHub-hosted ephemeral runners;
    # main releases remain on the isolated self-hosted build boundary.
    runs-on: ${{ github.ref == 'refs/heads/main' && 'clic-build' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    # Hosted runs do not expose the production kernel boundary. Main releases are
    # enforced on the dedicated self-hosted build boundary.
    env:
      APXM_CAPTURE_CONFINEMENT: ${{ github.ref == 'refs/heads/main' && 'enforce' || 'permissive' }}
    steps:

      - name: Install Nix on hosted runners
        if: github.ref != 'refs/heads/main'
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20

      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the locked Nix environment
        run: nix flake check --all-systems --no-update-lock-file

      - name: Run the APXM service-owner gate
        run: nix develop --command dekk agents check-service

  release-artifact:
    # The package is a run-scoped immutable artifact, not a mutable release.
    # Promotion to a runtime release remains an explicit owner operation.
    needs: service-gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Pull requests and non-main manual runs use GitHub-hosted ephemeral runners;
    # main releases remain on the isolated self-hosted build boundary.
    runs-on: ${{ github.ref == 'refs/heads/main' && 'clic-build' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    # Hosted runs do not expose the production kernel boundary. Main releases are
    # enforced on the dedicated self-hosted build boundary.
    env:
      APXM_CAPTURE_CONFINEMENT: ${{ github.ref == 'refs/heads/main' && 'enforce' || 'permissive' }}
    steps:

      - name: Install Nix on hosted runners
        if: github.ref != 'refs/heads/main'
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20

      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build the AMD64 APXM service binaries
        run: nix develop --command dekk agents build-service-artifacts

      - name: Build the native frontend carriers
        run: nix develop --command dekk agents test-compilation-service

      - name: Package and qualify the immutable APXM cohort
        run: nix develop --command dekk agents package-release

      - name: Verify the packaged APXM cohort as a consumer
        run: nix develop --command dekk agents verify-package

      - name: Upload the immutable APXM cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apxm-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: .apxm/release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
