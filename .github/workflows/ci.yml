name: apxm-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      show_release_descriptors:
        description: Print the refreshed release descriptors as a patch in the job log
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# A run that publishes must finish: a cancelled push would leave a commit that was
# only partly pushed. Only pull request runs are superseded.
concurrency:
  group: apxm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runner labels are the platform's scale-set labels. `apxm-check` is a pool without
  # the registry credential (a platform-provided label, to be created before this
  # workflow can run); `apxm` is the pool that holds it and runs only the image job.
  check:
    # A runner must never execute code from an untrusted fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Pull request code runs here, on an ephemeral one-job runner with neither a
    # registry credential nor an OIDC token.
    runs-on: [apxm-check]
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      APXM_CAPTURE_CONFINEMENT: enforce
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:

      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the locked Nix environment
        run: nix --option max-jobs 1 --option cores 1 flake check --all-systems --no-update-lock-file

      - name: Run the APXM service-owner gate
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents check-service

      - name: Prepare the exact AMD64 release cohort
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents prepare-release-descriptors

      # Replaces the descriptor artifact of the former workflow, which kept the refreshed
      # files on GitHub. The files are small and the patch applies with `git apply`.
      - name: Show the refreshed release descriptors
        if: github.event_name == 'workflow_dispatch' && inputs.show_release_descriptors
        run: >-
          git diff --patch --
          deploy/services/source-revision.v1.json
          contracts/descriptors/apxm.agents-owner-descriptor.v1.json
          contracts/descriptors/apxm.agents-owner-descriptor.v1.sha256
          contracts/services/manifests/apxm.agents-service-release-manifest.v1.json

      - name: Package and qualify the immutable APXM cohort
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents package-release

      - name: Verify the packaged APXM cohort as a consumer
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents verify-package

  # Builds the service images from the commit that main received and pushes them to the
  # platform registry. The images are consumed by digest only (see push-image.sh), so no
  # proof of origin is attached and the job needs no OIDC token.
  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: [apxm]
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      APXM_CAPTURE_CONFINEMENT: enforce
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:

      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      # The check job ran on another runner, so the cohort is prepared again here.
      - name: Prepare the exact AMD64 release cohort
        run: nix --option max-jobs 1 --option cores 1 develop --command dekk agents prepare-release-descriptors

      - name: Build the Linux AMD64 service image pair
        run: >-
          nix --option max-jobs 1 --option cores 1 develop --command dekk agents build-images
          --platform linux/amd64
          --qualified-descriptor-overlay

      - name: Verify the built image pair from the consumer boundary
        run: |
          # shellcheck disable=SC2016
          nix --option max-jobs 1 --option cores 1 develop --command bash -euo pipefail -c '
            dekk agents verify-images > image-evidence-verification.json
            python -m json.tool image-evidence-verification.json >/dev/null
          '

      - name: Push the verified images
        run: |
          for service in compilation-service runtime-service; do
            echo "$service $(.github/scripts/push-image.sh "$service" "apxm/$service:${GITHUB_SHA::8}")"
          done
