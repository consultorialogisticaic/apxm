# APXM — dekk agents install

[project]
name = "agents"
description = "MLIR compiler and runtime for agent graphs"


[tools]
cmake = { command = "cmake", version = ">=3.20" }
ninja = { command = "ninja" }
cargo = { command = "cargo", version = ">=1.70" }
python = { command = "python", version = ">=3.10" }
uv = { command = "uv" }

[env]
LLM_GATEWAY_KEY = "env:LLM_GATEWAY_KEY"
# Keep package-manager caches inside the managed checkout.  Besides making
# local gates reproducible, this avoids inheriting a user's unreadable or
# root-owned global npm/pip cache after a previous elevated install.
NPM_CONFIG_CACHE = "{project}/.dekk/npm-cache"
PIP_CACHE_DIR = "{project}/.dekk/pip-cache"
UV_CACHE_DIR = "{project}/.dekk/uv-cache"

# Intentionally NOT setting APXM_HOME: it's the user data root
# (default ~/.apxm), and pinning it to {project} broke roaming-bucket
# resolution. Override per-shell or via .apxm/config.toml instead.
PYTHONPATH = "{project}/crates/compiler/frontend/python:{project}/tools"
APXM_TYPESCRIPT_FRONTEND_PACKAGE = "{project}/crates/compiler/frontend/typescript"
APXM_TYPESCRIPT_AGENT_PACKAGING_PACKAGE = "{project}/crates/tools/cli/agent-packaging"
APXM_PYTHON_AGENT_PACKAGING_PACKAGE = "{project}/crates/tools/cli/agent-packaging-python"

[paths]
bin = [
	"{project}/bin",
	"{project}/target/release",
	"{home}/.local/bin",
	"{home}/.cargo/bin",
]
lib = ["{project}/target/release/lib"]

[commands]
compile-source-bundle = { run = "env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-source-port --example compile_source_bundle -- crates/compiler/frontend/python crates/compiler/frontend/typescript python node", description = "Compile one stdin SourceBundleRequest through installed frontends and print its committed executable artifact", group = "Compilation" }
build = { run = "python tools/scripts/cargo.py build -p apxm-cli --features driver,metrics --release", description = "Build the APXM CLI", skill = true, group = "Build & Test" }
build-dialect = { run = "python tools/scripts/cargo.py build-dialect", description = "Rebuild MLIR dialect (TableGen + C++ + Rust) after editing .td or .cpp files", skill = true, group = "Build & Test" }
# The workspace includes source-capture tests that launch the isolated Python
# frontend. Keep each Rust test binary's cases serial so the owner gate does
# not overload the host with concurrent frontend interpreters and turn valid
# submitted source into nondeterministic capture diagnostics.
test = { run = "python tools/scripts/check_frontend_parity.py && python tools/scripts/cargo.py test --workspace --exclude apxm-compiler --exclude apxm-cli -- --test-threads=1 && pytest crates/compiler/frontend/python/tests_program -q", description = "Run frontend parity, workspace, and canonical authoring tests", skill = true, group = "Build & Test" }
# The Nix shell exports native Clang and the pinned LLVM/MLIR package.
# Frontend commands below unset CC/CXX because their PyO3/napi modules use
# the host-language linker path; compiler and dialect commands retain the
# shell compiler so CMake sees the same toolchain on every supported host.

test-compiler = { run = "python tools/scripts/cargo.py test -p apxm-compiler --features mlir", description = "Run compiler AIR builder and pipeline tests", group = "Build & Test" }
test-source-port = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-source-port", description = "Run source-bundle compiler port conformance", group = "Build & Test" }
test-compilation-protocol = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-compilation-protocol", description = "Run Compilation Service protocol vectors", group = "Build & Test" }
test-artifact-registry = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-artifact-registry", description = "Run shared artifact reference and collection contracts", group = "Build & Test" }
test-core = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-core", description = "Run the owner contract and host Capability type tests", group = "Build & Test" }
test-compilation-service = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript ci --ignore-scripts --no-audit --no-fund && npm --prefix crates/compiler/frontend/typescript run build && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/install_frontend_native.py typescript && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py test -p apxm-compilation-service", description = "Build the declared Python/TypeScript frontends with a clean native linker environment, then run Compilation Service handler conformance with the same native loader boundary", group = "Build & Test" }
test-runtime-protocol = { run = "python tools/scripts/cargo.py test -p apxm-runtime-protocol", description = "Run Runtime Service protocol vectors", group = "Build & Test" }
test-runtime-service = { run = "python tools/scripts/cargo.py test -p apxm-runtime-service", description = "Run Runtime Service handler conformance", group = "Build & Test" }
test-capability = { run = "python tools/scripts/cargo.py test -p apxm-capability", description = "Run built-in Capability and skill reader conformance", group = "Build & Test" }
runtime-profile-ref = { run = "python tools/scripts/cargo.py run -p apxm-runtime-service --bin apxm-runtime-profile-ref --release", description = "Calculate an offline reviewed Runtime admission profile reference from exact image carrier files and selected Capability profile", group = "Build & Test" }
candidate-runtime-profile-ref = { run = "python tools/scripts/candidate_runtime_profile.py", description = "Verify an unpublished Runtime candidate and calculate its Host-only profile reference from exact in-image carriers", group = "Build & Test" }
# The two service images build the Linux executables from this checkout and
# regenerate the cohort's descriptors inside the build, so the labels a consumer
# reads are stamped from the manifest the image carries. `--platform` selects the
# target architecture; it defaults to this laptop's.
build-images = { run = "python tools/scripts/service_images.py build", description = "Build both APXM service images from the checkout and stamp their cohort labels", group = "Build & Test" }
build-candidate-images = { run = "python tools/scripts/service_images.py build --candidate", description = "Build an unpublished exact working-tree snapshot as a candidate Compilation/Runtime image pair", group = "Build & Test" }
verify-images = { run = "python tools/scripts/service_images.py verify", description = "Verify both APXM service images from the consumer boundary: labels, in-image release manifest, service bytes and cohort schema digests", group = "Build & Test" }
verify-candidate-images = { run = "python tools/scripts/service_images.py verify --candidate-provenance \"${APXM_CANDIDATE_RECEIPT:?set APXM_CANDIDATE_RECEIPT to the owner candidate.json path}\"", description = "Verify an unpublished candidate image pair against its frozen owner source receipt", group = "Build & Test" }
test-service-images = { run = "python -m unittest tools.tests.test_service_images", description = "Validate the service image build/verify contract and both Dockerfiles without a container runtime", group = "Build & Test" }
test-capability-iface = { run = "python tools/scripts/cargo.py test -p apxm-capability-iface", description = "Run sandbox interface and process execution conformance", group = "Build & Test" }
# This focused owner gate keeps the negative Compilation path, Runtime
# fail-closed path, and durable restart/recovery path visible as one declared
# product-neutral command.  It is intentionally narrower than the full owner
# qualification so failures identify the handoff/recovery boundary directly.
test-compilation-runtime-failure-restart = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-compilation-service failed_compile_has_no_store_entry && python tools/scripts/cargo.py test -p apxm-runtime-service unknown_digest_does_not_create_an_instance && python tools/scripts/cargo.py test -p apxm-runtime-service disconnect_does_not_fabricate_stop && python tools/scripts/cargo.py test -p apxm-kernel --test lifecycle committed_continuation_recovers_but_failure_paths_publish_nothing -- --exact && python tools/scripts/cargo.py test -p apxm-execution --test resume_and_ports resume_reads_the_committed_structural_continuation -- --exact", description = "Run neutral Compilation failure, Runtime fail-closed, and restart/recovery evidence", group = "Build & Test" }
release-qualification = { run = "python tools/scripts/release_qualification.py qualify --json", description = "Run owner check/test and exact Compilation/Runtime protocol gates, then validate immutable release descriptors and every published artifact and schema digest", group = "Build & Test" }
preflight-release = { run = "dekk agents check-service && dekk agents build-service-artifacts && dekk agents test-compilation-service && dekk agents package-release && dekk agents verify-package", description = "Run the same owner gate, service builds, package qualification, and consumer verification locally before publishing or dispatching CI", group = "Build & Test" }
package-release = { run = "python tools/scripts/release_qualification.py package --json", description = "Package and qualify one immutable local Compilation/Runtime release artifact with machine-readable owner evidence", group = "Build & Test" }
verify-package = { run = "python tools/scripts/release_qualification.py verify-package --json", description = "Verify an immutable APXM service release package from the consumer boundary with machine-readable evidence", group = "Build & Test" }
test-release-qualification = { run = "python -m unittest tools.tests.test_release_qualification", description = "Run the owner-local immutable release qualification unit tests", group = "Build & Test" }
qualify-release = { run = "python tools/scripts/release_qualification.py qualify", description = "Alias for the APXM owner release qualification gate", group = "Build & Test" }
owner-qualification = { run = "python tools/scripts/owner_qualification.py owner-qualification", description = "Run the neutral owner release, failure/restart, and immutable handoff qualification", group = "Owner Qualification" }
owner-failure-restart = { run = "python tools/scripts/owner_qualification.py owner-failure-restart", description = "Run neutral Compilation/Runtime failure and durable restart/recovery evidence with an immutable handoff", group = "Owner Qualification" }
test-owner-qualification = { run = "python -m unittest tools.tests.test_owner_qualification", description = "Validate neutral owner qualification, immutable handoff, and failure evidence", group = "Build & Test" }
build-service-artifacts = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-compilation-service -p apxm-runtime-service --release", description = "Build the exact APXM Compilation and Runtime service binaries used by the owner release boundary", group = "Build & Test" }
release-descriptors = { run = "python tools/scripts/release_qualification.py generate --compilation-service \"${APXM_COMPILATION_SERVICE_BINARY:?set APXM_COMPILATION_SERVICE_BINARY to the published Compilation Service executable}\" --runtime-service \"${APXM_RUNTIME_SERVICE_BINARY:?set APXM_RUNTIME_SERVICE_BINARY to the published Runtime Service executable}\" --output-dir .", description = "Generate product-neutral source, owner, sidecar, and service release descriptors from real APXM service binaries", group = "Build & Test" }
owner-e2e = { run = "python tools/scripts/owner_phase.py owner-e2e", description = "Owner end-to-end gate with one final structured owner result", group = "Owner Qualification" }
owner-compilation-runtime = { run = "python tools/scripts/owner_phase.py owner-compilation-runtime", description = "Owner Compilation/Runtime proof with one final structured owner result", group = "Owner Qualification" }
owner-negative-recovery = { run = "python tools/scripts/owner_phase.py owner-negative-recovery", description = "Owner negative/recovery proof with one final structured owner result", group = "Owner Qualification" }
owner-integrated-execution = { run = "python tools/scripts/owner_phase.py owner-integrated-execution", description = "Owner integrated execution proof with one final structured owner result", group = "Owner Qualification" }
owner-protocol-clients = { run = "python tools/scripts/owner_phase.py owner-protocol-clients", description = "Owner protocol/client proof with one final structured owner result", group = "Owner Qualification" }
owner-restart-reopen = { run = "python tools/scripts/owner_phase.py owner-restart-reopen", description = "Owner restart/reopen proof with one final structured owner result", group = "Owner Qualification" }
test-owner-phase = { run = "python -m unittest tools.tests.test_owner_phase", description = "Validate owner phase wrappers and final structured result shape", group = "Build & Test" }
test-compilation-client = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-compilation-client", description = "Run Compilation Client conformance", group = "Build & Test" }
test-interaction-client = { run = "python tools/scripts/cargo.py test -p apxm-interaction-client", description = "Run Interaction Client conformance", group = "Build & Test" }
test-openai-compat = { run = "python tools/scripts/cargo.py test -p apxm-openai-compat", description = "Run OpenAI protocol adapter conformance", group = "Build & Test" }
test-event-http = { run = "python tools/scripts/cargo.py test -p apxm-event-http", description = "Run Event HTTP projection conformance", group = "Build & Test" }
test-program = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-program", description = "Run Agent Program artifact and lowering conformance", group = "Build & Test" }
test-program-source = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-program --lib --test artifact_conformance --test lower_conformance --test semantic_conformance --test structural_containment", description = "Run source/compiler Agent Program graph, AIR, artifact, and source-map conformance", group = "Build & Test" }
test-kernel = { run = "python tools/scripts/cargo.py test -p apxm-kernel", description = "Run atomic execution commit and lifecycle conformance", group = "Build & Test" }
test-commit-local = { run = "python tools/scripts/cargo.py test -p apxm-commit-local", description = "Run P-018 owner-local commit adapters", group = "Build & Test" }
test-runtime-seams = { run = "python tools/scripts/cargo.py test -p apxm-inference -p apxm-execution", description = "Run focused model inference and execution runtime conformance", group = "Build & Test" }
test-execution = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && python tools/scripts/cargo.py test -p apxm-execution", description = "Run public-authored generic structural runtime conformance", group = "Build & Test" }
refresh-lockfile = { run = "python tools/scripts/cargo.py update --workspace --offline", description = "Refresh local workspace dependency edges without upgrading registry packages", group = "Build & Test" }
# `apxm-compiler` links the native dialect only with its `mlir` feature, so the
# aggregate suite asks for it by name. Everything else in the workspace builds
# without it, which is what `check-service` runs.
test-all = { run = "python tools/scripts/cargo.py test --workspace --features apxm-compiler/mlir", description = "All tests (requires MLIR)", group = "Build & Test" }
# The MLIR-free half of the gates: both services, both service protocols, the
# source port, both authoring frontends and the qualification tooling, plus
# format, lint and commit lint. Runs the `.dekk.toml` command of each step
# verbatim, with the MLIR toolchain variables unset, so it cannot drift from the
# suites the MLIR job runs. This is the whole service CI job.
check-service = { run = "python tools/scripts/service_gate.py", description = "Run every gate that needs no MLIR toolchain (services, protocols, frontends, qualification)", skill = true, group = "Build & Test" }
install-service = { run = "python tools/scripts/service_env.py", description = "Provision the service-only toolchain (Python, Node, uv, git) without MLIR, libclang, CMake or Ninja", group = "Configuration" }
test-service-gate = { run = "python -m unittest tools.tests.test_service_gate", description = "Validate the service-only gate step set and the service toolchain package set", group = "Build & Test" }
test-cli = { run = "npm --prefix crates/tools/cli/agent-packaging ci --ignore-scripts --no-audit --no-fund && python tools/scripts/cargo.py test -p apxm-cli --features driver,metrics --release && python tools/scripts/cargo.py test -p apxm-cli-dev --release", description = "Run CLI tests with agent-packaging dependencies", group = "Build & Test" }
test-frontend-generators = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-cli-dev frontend::", description = "Verify schema-driven frontend records, discriminated unions, serializers, vocabulary, and authoring documentation generation", group = "Build & Test" }
test-cli-installed-frontend = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python && python tools/scripts/cargo.py test -p apxm-cli --features driver,metrics --release -- --ignored && python tools/scripts/cargo.py test -p apxm-cli-dev --release -- --ignored", description = "Run the CLI tests that spawn a package entry against the installed Python authoring frontend", group = "Build & Test" }
test-python-frontend = { run = "if [ \"${APXM_SKIP_NATIVE_BUILD:-0}\" = \"1\" ]; then pytest crates/compiler/frontend/python/tests_program/test_frontend_conformance.py crates/compiler/frontend/python/tests_program/test_language_local_frontend.py crates/compiler/frontend/python/tests_program/test_capability_handlers.py crates/compiler/frontend/python/tests_program/test_packed_package.py -q; else env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python && APXM_SKIP_NATIVE_BUILD=1 pytest crates/compiler/frontend/python/tests_program/test_frontend_conformance.py crates/compiler/frontend/python/tests_program/test_language_local_frontend.py crates/compiler/frontend/python/tests_program/test_capability_handlers.py crates/compiler/frontend/python/tests_program/test_packed_package.py -q; fi", description = "Run the shared frontend-conformance corpus, the generic Python frontend, and packed-wheel tests", group = "Build & Test" }
test-typescript-frontend = { run = "npm --prefix crates/compiler/frontend/typescript ci --ignore-scripts --no-audit --no-fund && npm --prefix crates/compiler/frontend/typescript run typecheck && npm --prefix crates/compiler/frontend/typescript run typecheck:test && env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-typescript --release && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && npm --prefix crates/compiler/frontend/typescript test", description = "Install the locked frontend dependencies, then run the shared frontend-conformance corpus, generic TypeScript frontend, and packed-package tests", group = "Build & Test" }
test-external-source-package = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-typescript --release && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && python tools/scripts/check_external_typescript_package.py tools/tests/fixtures/external-typescript-package", description = "Compile an external TypeScript Agent Program package through the public frontend", group = "Build & Test" }
test-handler-packaging = { run = "npm --prefix crates/tools/cli/agent-packaging test", description = "Run private TypeScript handler-packaging API conformance", group = "Build & Test" }
test-frontend-examples = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && rm -rf crates/compiler/frontend/python/build crates/compiler/frontend/python/apxm.egg-info .apxm/frontend-example-python .apxm/frontend-example-packages && mkdir -p .apxm/frontend-example-python .apxm/frontend-example-packages && pip wheel --no-deps --no-build-isolation --wheel-dir .apxm/frontend-example-packages crates/compiler/frontend/python && pip install --no-deps --target .apxm/frontend-example-python .apxm/frontend-example-packages/*.whl && npm --prefix examples/agents/conversational ci --ignore-scripts --no-audit --no-fund && npm --prefix examples/agents/conversational run build && npm --prefix examples/agents/conversational run build:python && npm --prefix examples/agents/conversational run compile >/dev/null && npm --prefix examples/agents/conversational run run >/dev/null && PYTHONPATH=\"$PWD/.apxm/frontend-example-python\" npm --prefix examples/agents/conversational run compile:python >/dev/null && PYTHONPATH=\"$PWD/.apxm/frontend-example-python\" npm --prefix examples/agents/conversational run run:python >/dev/null && npm --prefix examples/agents/coder ci --ignore-scripts --no-audit --no-fund && npm --prefix examples/agents/coder run build && npm --prefix examples/agents/coder run compile >/dev/null && npm --prefix examples/agents/coder run run >/dev/null && PYTHONPATH=.apxm/frontend-example-python pytest examples/agents/conversational/tests/test_parity.py -q && python examples/agents/coder/tests/acceptance.py", description = "Build, compile, run, and validate the lockfile-backed conversational and Coder repository examples", group = "Build & Test" }
build-frontend-native = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-frontend-python --release && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/install_frontend_native.py python", description = "Build the canonical PyO3 authoring bridge (_native.so) reproducibly from source", group = "Build & Test" }
build-example-artifacts = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && npm --prefix examples/agents/conversational ci --ignore-scripts --no-audit --no-fund && npm --prefix examples/agents/conversational run build && python tools/scripts/build_example_artifacts.py --python-package-root crates/compiler/frontend/python", description = "Build deterministic repository example executable artifacts from the lockfile-backed generic frontends", group = "Build & Test" }
check-example-artifacts = { run = "python tools/scripts/build_example_artifacts.py --python-package-root crates/compiler/frontend/python --check", description = "Drift-check repository example executable artifacts", group = "Build & Test" }
build-agent-packages = { run = "python tools/scripts/agent_packages.py --build", description = "Rebuild every checked-in agent package's integrity chain", group = "Build & Test" }
check-agent-packages = { run = "python tools/scripts/agent_packages.py", description = "Lint every checked-in agent package and verify it against its own integrity chain", group = "Build & Test" }
check-agent-skills = { run = "python tools/scripts/validate_agent_skill.py --root .agents/skills --root examples/agents/skilled/skills --root examples/agents/conversational/skills", description = "Validate every checked-in Agent Skill directory the project and example package discovery roots publish", group = "Build & Test" }
test-canonical-only = { run = "python -m unittest tools.tests.test_canonical_only_reachability", description = "Reject retired execution surfaces from the build graph", group = "Build & Test" }
test-skill-example = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python && python tools/scripts/cargo.py build -p apxm-cli-dev --bin apxm-dev >/dev/null && PYTHONPATH=crates/compiler/frontend/python python examples/agents/skilled/tests/acceptance.py", description = "Compile the Skilled example and execute it, reading both declared Agent Skills through read_skill", group = "Build & Test" }
test-package-handler-example = { run = "python tools/scripts/cargo.py build -p apxm-cli-dev --bin apxm-dev >/dev/null && npm --prefix examples/agents/coder ci --ignore-scripts --no-audit --no-fund && npm --prefix examples/agents/coder run build && python examples/agents/coder/tests/execution.py", description = "Execute the Capability handlers the lockfile-backed Coder package ships through the shipped execute-canonical", group = "Build & Test" }
test-python-handler-example = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python && python tools/scripts/cargo.py build -p apxm-cli-dev --bin apxm-dev >/dev/null && python tools/tests/python_handler_execution.py", description = "Execute the Python Capability handler a fixture package ships through the shipped execute-canonical", group = "Build & Test" }
test-dekk-cli-wrapper ={ run = "python -m unittest tools.tests.test_dekk_cli_wrapper", description = "Run exact APXM CLI wrapper target-selection and native-toolchain readiness guards", group = "Build & Test" }
test-frontend-native-install = { run = "python -m unittest tools.tests.test_frontend_native_install", description = "Run native frontend bridge installation and macOS signing conformance", group = "Build & Test" }
frontend-cli-path = { run = "python tools/scripts/cargo.py build -p apxm-cli --bin apxm >/dev/null && target_dir=$(python tools/scripts/cargo.py target-dir) && printf '%s/debug/apxm\\n' \"$target_dir\"", description = "Build the debug APXM CLI and print its path for frontend integration tests", group = "Build & Test" }
frontend-typescript-package-path = { run = "python tools/scripts/cargo.py build -p apxm-frontend-typescript --release >/dev/null && npm --prefix crates/compiler/frontend/typescript run build >/dev/null && python tools/scripts/install_frontend_native.py typescript && printf '%s/crates/compiler/frontend/typescript\\n' \"$PWD\"", description = "Build the TypeScript frontend package and print its path for frontend integration tests", group = "Build & Test" }
check-frontend-parity = { run = "python tools/scripts/check_frontend_parity.py", description = "Prove Python/TypeScript frontends emit closed-semantics-equivalent AIR (source maps may differ by language)", group = "Build & Test" }
check-frontend-surface = { run = "python tools/scripts/check_frontend_surface.py", description = "Prove every language projects the whole frontend surface with the argument shape, generated diagnostics, and documented imports the manifest declares", group = "Build & Test" }
check-deversion = { run = "python tools/scripts/deversion_inventory.py --check", description = "Prove no Agents-owned versioned schema id or filename survived the de-versioning sweep", group = "Build & Test" }
deversion-inventory = { run = "python tools/scripts/deversion_inventory.py", description = "Report every versioned identifier split into Agents-owned and foreign-owner, with file renames and stale path references", group = "Build & Test" }
